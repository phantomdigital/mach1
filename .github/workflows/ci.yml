name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run prismic:translation:test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.mach1logistics.com.au
          NEXT_PUBLIC_PRISMIC_ENVIRONMENT: mach1logistics
